mode: testnet
exchange: binanceusdm

top_n: 30
scan_interval_seconds: 60
scan_workers: 16
ohlcv_limit: 120

excluded_symbols: []
timeframes: ["15m", "1h"]

enabled_strategies:
  - ORB
  - LiquiditySweep
  - MARibbon
  - StochBB
  - PivotScalp
  - EMARSIScalp
  - OrderBlock
  - SupplyDemand
  - FVG
  - BOS_CHOCH
  - TrendMA
  - MomentumRSI
  - PullbackEMA
  - RangeBounce
  - OI_Funding
  - SwingMACross
  - SwingRSI
  - FibPullback
  - BBSqueeze

strategy_params:
  ORB: {range_bars: 4, rr: 2.0}
  LiquiditySweep: {lookback: 30, rr: 2.0}
  MARibbon: {sma1: 5, sma2: 8, sma3: 13, rr: 1.8}
  StochBB: {k_period: 5, d_period: 3, bb_period: 13, bb_std: 3.0, rr: 1.6}
  PivotScalp: {left: 2, right: 2, rr: 1.6}
  EMARSIScalp: {ema_fast: 8, ema_slow: 21, rsi_period: 7, rr: 1.5}
  OrderBlock: {impulse_mult: 2.2, rr: 2.5}
  SupplyDemand: {rr: 2.0}
  FVG: {min_gap_pct: 0.0015, rr: 2.2}
  BOS_CHOCH: {swing_lookback: 5, rr: 2.3}
  OI_Funding: {funding_extreme: 0.0008, min_oi_change: 0.03, rr: 2.0}
  TrendMA: {ema_fast: 9, ema_slow: 21, rr: 2.0}
  MomentumRSI: {rsi_period: 14, rr: 2.0}
  PullbackEMA: {ema_period: 21, trend_ema: 50, rr: 2.2}
  RangeBounce: {lookback: 40, rr: 1.8}
  SwingMACross: {ema_fast: 20, ema_slow: 50, rr: 2.5}
  SwingRSI: {rsi_period: 14, rr: 2.5}
  FibPullback: {lookback: 60, rr: 2.5}
  BBSqueeze: {bb_period: 20, bb_std: 2.0, rr: 2.5}

initial_capital: 1000
quote_asset: USDT
log_level: INFO
log_file: logs/bot.log
